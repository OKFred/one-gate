packages:
  - "packages/*"
  - "server"
  - "server/packages/*"
  - "server/apps/*"
  - "platform"
  - "platform/packages/*"
  - "platform/apps/*"

minimumReleaseAge: 0

allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  sharp: true
  utf-8-validate: true
  workerd: true

onlyBuiltDependencies:
  - "@swc/core"
  - better-sqlite3
  - bufferutil
  - esbuild
  - sharp
  - utf-8-validate
  - workerd
