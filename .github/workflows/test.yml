name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: one_gate_test
          POSTGRES_USER: one_gate_test
          POSTGRES_PASSWORD: disposable-ci-postgresql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U one_gate_test -d one_gate_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONE_GATE_TEST_POSTGRES_URL: postgresql://one_gate_test:disposable-ci-postgresql@127.0.0.1:5432/one_gate_test
      HODOR_AUTH_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      JWT_SECRET: "test-secret-key-for-ci-runs"
      HODOR_TOTP_GATE_SECRET: "JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP"
      HODOR_ALLOWED_WEB_ORIGINS: "http://localhost:5173"
      BASE_API_PATH: "/api/v1"
      LOCALE: "zh-CN"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable && corepack install --global pnpm@11.5.0
      - name: Install backend
        run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Check PostgreSQL DDL against models
        run: pnpm run db:generate:postgresql
        working-directory: server
      - name: Real PostgreSQL integration tests
        run: pnpm exec vitest run --config vitest.config.postgresql.mts
        working-directory: server/apps/server
      - name: Bundle PostgreSQL Worker locally
        run: pnpm exec wrangler deploy --config wrangler.postgresql.jsonc --dry-run --outdir .wrangler/ci-pg-bundle
        working-directory: server/apps/server

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HODOR_AUTH_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      JWT_SECRET: "test-secret-key-for-ci-runs"
      BASE_API_PATH: "/api/v1"
      LOCALE: "zh-CN"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable && corepack install --global pnpm@11.5.0
      - name: Install backend
        run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Check asset DDL matches current models
        run: |
          pnpm exec tsc --noEmit --strict --skipLibCheck --module ESNext --moduleResolution Bundler --target ESNext --types node scripts/generate-enterprise-assets.ts
          pnpm run db:generate:assets
          pnpm run db:generate:cloudflare-usage
        working-directory: server
      - name: Create isolated Worker test configuration
        working-directory: server/apps/server
        run: |
          cat > .dev.vars <<'EOF'
          NODE_ENV=test
          BASE_API_PATH=/api/v1
          LOCALE=zh-CN
          JWT_SECRET=test-secret-key-for-ci-runs
          HODOR_AUTH_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MOBILE_SENSITIVE_DATA_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MOBILE_RELEASE_PUBLISH_TOKEN=test-only-mobile-publish-token
          HODOR_ALLOWED_WEB_ORIGINS=http://localhost:5173
          HODOR_TOTP_GATE_SECRET=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
          EOF
      - name: Node tests
        run: pnpm exec vitest run --config vitest.config.node.mts --maxWorkers=2
        working-directory: server/apps/server
      - name: Worker and D1 retention and enterprise isolation regression
        run: pnpm exec vitest run --config vitest.config.workers.mts recycle-bin soft-delete department-cleanup undo.integration tenant-isolation enterprise-http asset access-metadata disabled-role-auth cloudflare-usage ai/chat --maxWorkers=1
        working-directory: server/apps/server
      - name: Backend application types
        run: pnpm exec tsc --noEmit -p apps/server/tsconfig.json
        working-directory: server
      - name: Build Node backend
        run: pnpm run build
        working-directory: server
      - name: Bundle Worker locally
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/ci-bundle
        working-directory: server/apps/server

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HODOR_E2E_BASE_URL: http://127.0.0.1:4173
      HODOR_E2E_ALLOWED_ORIGINS: http://127.0.0.1:4173
      HODOR_E2E_MOCK_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable && corepack install --global pnpm@11.5.0
      - name: Install frontend
        run: pnpm install --frozen-lockfile
        working-directory: platform
      - name: Reject native browser dialogs
        run: pnpm run check:native-dialogs
        working-directory: platform
      - name: Browser test types
        run: pnpm run typecheck:e2e
        working-directory: platform
      - name: Build all frontends
        run: pnpm run build:all
        working-directory: platform
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --no-shell chromium
        working-directory: platform
      - name: Mocked auth, recycle bin, undo and enterprise isolation tests
        run: pnpm exec playwright test auth/auth-ui.spec.ts recycle-bin/recycle-bin.spec.ts delete-undo/ enterprise-assets/ api-token/ cloudflare-home/ --project=chromium
        working-directory: platform

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          tool_dir=$(mktemp -d)
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --retry 3 "$release/$archive" -o "$tool_dir/$archive"
          curl --fail --location --retry 3 "$release/$checksums" -o "$tool_dir/$checksums"
          (cd "$tool_dir" && grep "  $archive$" "$checksums" | sha256sum --check --strict)
          tar -xzf "$tool_dir/$archive" -C "$tool_dir"
          "$tool_dir/gitleaks" git . --log-opts="--all --full-history -m" --redact --no-banner
