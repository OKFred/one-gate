name: Run Server Tests & Deploy

env:
  FORCE_JUST_ACTIONS_TO_NODE24: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - feature/SOC-20260611-fred
      - dev
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # Job 1：跑测试
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "server/pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./server

      - name: Run All Tests
        run: npx vitest run --config vitest.config.node.mts
        working-directory: ./server/apps/server
        # ─── 核心步骤：将 GitHub 存储的 Secrets 注入到测试的运行环境变量中 ───
        env:
          TEST_MAIL_ADDRESS: ${{ secrets.TEST_MAIL_ADDRESS }}
          TEST_MAIL_PASSWORD: ${{ secrets.TEST_MAIL_PASSWORD }}
          TEST_MAIL_HOST: ${{ secrets.TEST_MAIL_HOST }}
          TEST_MAIL_PORT: ${{ secrets.TEST_MAIL_PORT }}
          TEST_MAIL_RECEIVER: ${{ secrets.TEST_MAIL_RECEIVER }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GH_ORG_NAME: ${{ secrets.GH_ORG_NAME }}
          FEISHU_APP_ID: "cli_test_feishu_app"
          FEISHU_APP_SECRET: "test-feishu-secret"
          FEISHU_ALLOWED_TENANT_KEYS: "tenant-test"
          OAUTH_ALLOWED_REDIRECT_ORIGINS: "http://localhost:5173"
          OAUTH_SENSITIVE_DATA_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          JWT_SECRET: "test-secret-key-for-ci-runs"
          BASE_API_PATH: "/api/v1"
          LOCALE: "zh-CN"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./platform

      - name: Build Admin for Mock OAuth E2E
        run: pnpm run build:admin
        working-directory: ./platform

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./platform

      - name: Run Mock OAuth E2E
        run: pnpm run test:e2e:oauth
        working-directory: ./platform
        env:
          HODOR_E2E_BASE_URL: http://127.0.0.1:4173
          HODOR_E2E_ALLOWED_ORIGINS: http://127.0.0.1:4173
          HODOR_E2E_MOCK_OAUTH: "true"

  # Job 2：部署（仅在测试成功，且为 master/dev 分支时运行）
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "server/pnpm-lock.yaml"

      # ─── 步骤 1: 部署后端 Workers ───
      - name: Install Backend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./server

      # D1 结构是 Worker 发布前置条件；迁移或合约失败必须阻断新代码上线。
      - name: Apply Remote D1 Migrations
        run: pnpm run db:migrate:worker:remote
        working-directory: ./server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Remote D1 Schema Contract
        run: pnpm run db:check:worker:remote
        working-directory: ./server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Workers Backend
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "server/apps/server"
          packageManager: pnpm
          wranglerVersion: "4.100.0"
          command: deploy
          secrets: |
            GH_CLIENT_ID
            GH_CLIENT_SECRET
            GH_ORG_NAME
            FEISHU_APP_ID
            FEISHU_APP_SECRET
            FEISHU_ALLOWED_TENANT_KEYS
            OAUTH_ALLOWED_REDIRECT_ORIGINS
            OAUTH_SENSITIVE_DATA_KEY
            JWT_SECRET
            MOBILE_SENSITIVE_DATA_KEY
        env:
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GH_ORG_NAME: ${{ secrets.GH_ORG_NAME }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ALLOWED_TENANT_KEYS: ${{ secrets.FEISHU_ALLOWED_TENANT_KEYS }}
          OAUTH_ALLOWED_REDIRECT_ORIGINS: ${{ secrets.OAUTH_ALLOWED_REDIRECT_ORIGINS }}
          OAUTH_SENSITIVE_DATA_KEY: ${{ secrets.OAUTH_SENSITIVE_DATA_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MOBILE_SENSITIVE_DATA_KEY: ${{ secrets.MOBILE_SENSITIVE_DATA_KEY }}

      # 系统 Schema 属于发布产物的一部分；失败时阻断 Pages 发布，避免 UI 依赖空 D1 配置。
      - name: Sync System Schemas to Remote D1
        run: pnpm run sync:schemas --remote
        working-directory: ./server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ─── 步骤 2: 部署前端 Pages ───
      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./platform

      - name: Build Frontend
        run: pnpm run build:all
        working-directory: ./platform
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          VITE_ENTERPRISE_URL: ${{ secrets.VITE_ENTERPRISE_URL }}
          VITE_PERSONAL_URL: ${{ secrets.VITE_PERSONAL_URL }}

      # ─── 步骤 2a: 部署主系统 Admin (gate) ───
      - name: Deploy Admin Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          command: pages deploy ./platform/apps/admin/dist --project-name=gate

      # ─── 步骤 2b: 部署企业系统 Enterprise (gate-enterprise) ───
      - name: Deploy Enterprise Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          command: pages deploy ./platform/apps/enterprise/dist --project-name=gate-enterprise --branch=dev # 强制指定为 production 分支

      # ─── 步骤 2c: 部署个人系统 Personal (gate-personal) ───
      - name: Deploy Personal Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          command: pages deploy ./platform/apps/personal/dist --project-name=gate-personal --branch=dev # 强制指定为 production 分支
