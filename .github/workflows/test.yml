name: Run Server Tests & Deploy

env:
  FORCE_JUST_ACTIONS_TO_NODE24: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - master
      - dev
      - feature/SOC-20260611-fred
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  # Job 1：跑测试
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "server/pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./server

      - name: Run All Tests
        run: npx vitest run
        working-directory: ./server
        # ─── 核心步骤：将 GitHub 存储的 Secrets 注入到测试的运行环境变量中 ───
        env:
          TEST_MAIL_ADDRESS: ${{ secrets.TEST_MAIL_ADDRESS }}
          TEST_MAIL_PASSWORD: ${{ secrets.TEST_MAIL_PASSWORD }}
          TEST_MAIL_HOST: ${{ secrets.TEST_MAIL_HOST }}
          TEST_MAIL_PORT: ${{ secrets.TEST_MAIL_PORT }}
          TEST_MAIL_RECEIVER: ${{ secrets.TEST_MAIL_RECEIVER }}
          JWT_SECRET: "test-secret-key-for-ci-runs"
          BASE_API_PATH: "/api/v1"
          LOCALE: "zh-CN"

  # Job 2：部署（仅在测试成功，且为 main/master/dev 分支时运行）
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "server/pnpm-lock.yaml"

      # ─── 步骤 1: 部署后端 Workers ───
      - name: Install Backend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./server

      - name: Deploy Workers Backend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "server"
          command: deploy

      # ─── 步骤 2: 部署前端 Pages ───
      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./platform

      - name: Build Frontend
        run: pnpm run build
        working-directory: ./platform
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}

      - name: Deploy Pages Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./platform/dist --project-name=gate
