services:
  # 后端API服务
  backend:
    image: registry.cn-hangzhou.aliyuncs.com/one-registry/node-server-server
    container_name: mail-backend
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - ./server/.env
    volumes:
      - ./server/logs:/app/logs
      - ./data.db:/data.db
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8787/healthCheck', (res) => { process.exit(res.statusCode ? 0 : 1) })",
        ]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 前端应用和Nginx代理
  frontend:
    image: registry.cn-hangzhou.aliyuncs.com/one-registry/node-server-platform
    container_name: mail-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nginx-logs:
    driver: local
